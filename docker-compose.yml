services:
  gradle:
    image: gradle:latest
    user: "0:0"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gradle-cache:/gradle
    environment:
      GRADLE_USER_HOME: /gradle
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    command: ./gradlew build

volumes:
  gradle-cache:
    name: gradle-cache

